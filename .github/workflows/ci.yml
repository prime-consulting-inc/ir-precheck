name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q -ra

  versions:
    name: Version numbers match
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: SKILL.md, plugin.json, marketplace.json and the script carry the same version
        run: |
          v_skill=$(grep -m1 '^  version:' skills/ir-precheck/SKILL.md | sed -E 's/.*"(.*)".*/\1/')
          v_py=$(grep -m1 '^__version__' skills/ir-precheck/scripts/ir_precheck.py | sed -E 's/.*"(.*)".*/\1/')
          v_plugin=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          v_market=$(python3 -c 'import json;print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          echo "$v_skill $v_py $v_plugin $v_market"
          test "$v_skill" = "$v_py" && test "$v_py" = "$v_plugin" && test "$v_plugin" = "$v_market"
